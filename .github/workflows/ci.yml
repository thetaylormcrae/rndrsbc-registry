name: Catalog CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build + validate feed
        run: python3 build_feed.py
      - name: Show feed always (never fail on change)
        run: git diff --stat catalog/_feed.json || true
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build feed + artifacts (absolute URLs against Pages host)
        run: |
          # The registry serves on the custom Pages domain, so artifact URLs are
          # absolute against it — fetchable by the engine without a redirect hop.
          python3 build_feed.py --host "https://taylor.mcrae.site/rndrsbc-registry"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - uses: actions/deploy-pages@v4
